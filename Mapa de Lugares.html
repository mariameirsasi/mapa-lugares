<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mapa de Lugares — Andar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #F2B100;
    --ink: #1c2127;
    --muted: #6b7480;
    --line: #e3e7ec;
    --bg: #eef1f4;
    --carpet: #cdd2d8;
    --white-desk: #ffffff;
    --shadow: 0 1px 2px rgba(20,28,40,.06), 0 6px 18px rgba(20,28,40,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  #root, .app { height: 100%; }
  .app { display: flex; flex-direction: column; }

  /* topbar */
  .topbar {
    display: flex; align-items: center; gap: 28px;
    padding: 14px 22px; background: #fff; border-bottom: 1px solid var(--line);
    flex: 0 0 auto; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto;
    background: var(--yellow);
    box-shadow: inset 0 0 0 4px rgba(0,0,0,.08);
  }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: -.02em; }
  .brand p { margin: 1px 0 0; font-size: 12px; color: var(--muted); font-weight: 500; }
  .stats { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .stat {
    background: #f4f6f8; border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 14px; min-width: 72px; text-align: center;
  }
  .stat b { display: block; font-size: 19px; font-weight: 800; line-height: 1; }
  .stat span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .top-actions { display: flex; gap: 8px; }

  .btn {
    font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer;
    border-radius: 9px; padding: 9px 14px; border: 1px solid var(--line); background: #fff; color: var(--ink);
    transition: .15s; white-space: nowrap;
  }
  .btn:hover { background: #f4f6f8; }
  .btn.ghost { color: var(--muted); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); width: 100%; padding: 11px; font-size: 13.5px; }
  .btn.primary:hover { background: #000; }

  /* body layout */
  .body { flex: 1 1 auto; display: flex; min-height: 0; }
  .sidebar {
    flex: 0 0 320px; width: 320px; background: var(--bg);
    border-right: 1px solid var(--line); padding: 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px;
  }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .card h2 { font-size: 13px; margin: 0 0 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }

  .reg-form { display: flex; flex-direction: column; gap: 10px; }
  .input {
    font-family: inherit; font-size: 14px; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; width: 100%; color: var(--ink);
  }
  .input:focus { outline: none; border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(242,177,0,.18); }
  .sector-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .sector-chip {
    font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    padding: 8px 6px; border-radius: 9px; border: 1.5px solid; background: #fff; transition: .12s;
  }
  .sector-chip:hover { filter: brightness(.97); }

  /* pool */
  .pool-card { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .pool-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .pool-head h2 { margin: 0; }
  .hint { font-size: 11px; color: var(--muted); font-weight: 500; }
  .filter-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .ftab {
    font-family: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
    padding: 5px 9px; border-radius: 20px; border: 1px solid var(--line); background: #fff; color: var(--muted);
    display: inline-flex; align-items: center; gap: 5px; transition: .12s;
  }
  .ftab i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .ftab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .ftab:not(.on):hover { background: #f4f6f8; }

  .pool { flex: 1 1 auto; overflow-y: auto; border: 1.5px dashed transparent; border-radius: 10px; margin: -4px; padding: 4px; }
  .pool.dragover { border-color: var(--line); background: rgba(0,0,0,.02); }
  .pool-sub { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 6px 2px 8px; }
  .pool-sub.muted { opacity: .65; margin-top: 14px; }
  .pool-grid { display: flex; flex-direction: column; gap: 7px; }
  .empty-note { font-size: 12.5px; color: var(--muted); margin: 4px 2px; }

  .pcard {
    display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 10px;
    background: #fff; border: 1px solid var(--line); cursor: grab; transition: .12s; user-select: none;
  }
  .pcard:hover { box-shadow: var(--shadow); border-color: #d3d8de; }
  .pcard:active { cursor: grabbing; }
  .pcard.seated { opacity: .55; cursor: default; background: #f6f7f9; }
  .pcard-av {
    width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12.5px;
  }
  .pcard-name { font-size: 13.5px; font-weight: 600; flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard-del {
    border: none; background: none; color: #b8c0c8; font-size: 18px; cursor: pointer; line-height: 1; padding: 0 2px;
  }
  .pcard-del:hover { color: #e23b3b; }
  .pcard-seat { color: #9aa3ad; font-size: 10px; }

  /* stage / floor */
  .stage { flex: 1 1 auto; min-width: 0; overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 0%, #f6f8fa, #e7ebef 70%);
  }
  .floor-scaler { transform-origin: center center; }
  .floor {
    position: relative; border-radius: 8px; overflow: hidden;
    background: var(--carpet);
    box-shadow: 0 10px 40px rgba(20,28,40,.18), inset 0 0 0 1px rgba(0,0,0,.04);
  }
  .tiles { position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .window { position: absolute; background: linear-gradient(180deg,#bcd6e6,#9cbcd0); }
  .window-top { border-radius: 0 0 3px 3px; box-shadow: inset 0 -2px 4px rgba(0,0,0,.1); }
  .window-right { border-radius: 3px 0 0 3px; box-shadow: inset -2px 0 4px rgba(0,0,0,.1); }

  .pillar {
    position: absolute; width: 44px; height: 44px; border-radius: 7px;
    background: var(--yellow);
    box-shadow: 0 6px 14px rgba(0,0,0,.22), inset 0 0 0 3px rgba(0,0,0,.07);
  }

  .zone { position: absolute; border-radius: 10px; display: flex; align-items: flex-end; padding: 10px; }
  .zone-label { font-size: 13px; font-weight: 700; color: #5a636d; }

  /* corridor */
  .zone-corridor { align-items: center; justify-content: flex-start; padding-left: 26px;
    background: rgba(255,255,255,.16);
    border-top: 2px dashed rgba(255,255,255,.55); border-bottom: 2px dashed rgba(255,255,255,.55); border-radius: 0; }
  .zone-corridor .zone-label { color: #4b545e; letter-spacing: .3em; text-transform: uppercase; font-size: 11px;
    background: rgba(236,239,242,.85); padding: 3px 10px; border-radius: 20px; }

  /* manager office */
  .zone-office { background: rgba(242,177,0,.12); border: 2px solid var(--yellow); border-radius: 14px; }
  .zone-office .zone-label { color: #8a6a00; }

  /* glass room */
  .zone-glassroom { background: rgba(170,202,222,.18); border: 2px solid rgba(110,162,196,.9);
    border-radius: 12px; align-items: flex-start;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
  .zone-glassroom .zone-label { color: #3a5d77; font-weight: 800; font-size: 12px;
    text-transform: uppercase; letter-spacing: .05em; }

  /* meeting booths inside glass room */
  .zone-booth { background: rgba(150,190,214,.55); border: 1.5px solid rgba(96,150,186,.95);
    border-radius: 6px; align-items: center; justify-content: center; padding: 0; }
  .zone-booth .zone-label { color: #2f536e; font-size: 11.5px; font-weight: 700; }

  /* copa */
  .zone-room { background: #e6e2d6; border: 1px solid #d2cdbd; }
  .zone-room .zone-label { color: #7a715a; }

  /* entrance */
  .zone-door { background: repeating-linear-gradient(45deg,#dfe3e7,#dfe3e7 8px,#d6dadf 8px,#d6dadf 16px);
    border: 1px dashed #b8c0c8; align-items: center; }
  .zone-door .zone-label { color: #6b7480; }
  .zone-door .zone-label::after { content: ' ↓'; }

  /* desk island */
  .island { position: absolute; }
  .desk-surface {
    position: absolute;
    background: var(--white-desk); border-radius: 8px;
    box-shadow: 0 3px 8px rgba(20,28,40,.16), inset 0 0 0 1px rgba(0,0,0,.04);
  }
  .desk-spine { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #edeff2; transform: translateX(-50%); }
  .desk-flag {
    position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .03em;
    padding: 3px 12px; border-radius: 20px; white-space: nowrap; z-index: 4;
    box-shadow: 0 3px 8px rgba(20,28,40,.25);
  }
  .desk-flag.sm { top: 2px; font-size: 10px; padding: 2px 8px; }

  /* seats */
  .seat-wrap { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }
  .seat {
    position: relative; width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; transition: .12s; user-select: none;
  }
  .seat.empty {
    background: rgba(255,255,255,.62); color: #97a0aa; border: 2px dashed #aab2bb;
    font-size: 22px; cursor: pointer; font-weight: 500;
  }
  .seat.empty:hover { background: #fff; border-color: var(--yellow); color: var(--yellow); transform: scale(1.06); }
  .seat.empty.over { background: #fff; border-color: var(--yellow); border-style: solid; color: var(--yellow); transform: scale(1.1); }
  .seat.filled { cursor: grab; font-size: 15px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .seat.filled:active { cursor: grabbing; }
  .seat.sm { width: 44px; height: 44px; }
  .seat.sm.empty { font-size: 20px; border-width: 2px; }
  .seat.sm.filled { font-size: 14px; }
  .seat-remove {
    position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #fff; background: #2b3138; color: #fff; font-size: 12px; line-height: 1; cursor: pointer;
    display: none; align-items: center; justify-content: center; padding: 0;
  }
  .seat.filled:hover .seat-remove { display: flex; }
  .seat-remove:hover { background: #e23b3b; }
  .seat-name {
    margin-top: 3px; font-size: 10px; font-weight: 700; color: #3a424c;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; max-width: 58px;
    background: rgba(255,255,255,.8); padding: 0 4px; border-radius: 4px;
  }

  .avatar { border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }

  .floor-legend {
    position: absolute; right: 18px; top: 26px; display: flex; gap: 14px;
    background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px;
    box-shadow: var(--shadow);
  }
  .floor-legend .lg { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #3a424c; }
  .floor-legend .lg i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  /* modal picker */
  .modal-bg { position: fixed; inset: 0; background: rgba(20,28,40,.42);
    display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 16px; width: 360px; max-width: 92vw; max-height: 80vh;
    padding: 18px; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .modal-head h3 { margin: 0; font-size: 16px; font-weight: 800; }
  .modal-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .modal .x { border: none; background: #f1f3f5; width: 28px; height: 28px; border-radius: 8px;
    font-size: 18px; cursor: pointer; color: var(--muted); }
  .modal .x:hover { background: #e7eaed; }
  .picker-list { overflow-y: auto; margin-top: 12px; }
  .pick-group { margin-bottom: 12px; }
  .pick-group-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .pick-group-h i { width: 9px; height: 9px; border-radius: 50%; }
  .pick-row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 7px 8px; border-radius: 9px; border: 1px solid transparent; background: none;
  }
  .pick-row:hover { background: #f4f6f8; }
  .pick-av { width: 30px; height: 30px; border-radius: 50%; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- ===== Layout Data ===== -->
  <script>
    window.FLOOR = { w: 1520, h: 642 };

    window.SECTORS = {
      comercial: { label: 'Comercial', color: '#2563EB', soft: '#E8EFFD' },
      marketing: { label: 'Marketing', color: '#EA580C', soft: '#FCEDE4' },
      juridico:  { label: 'Jurídico',  color: '#7C3AED', soft: '#F0EAFB' },
      tecnico:   { label: 'Técnico',   color: '#0D9488', soft: '#E2F2F0' },
    };

    window.DESKS = (function () {
      const list = [];
      const start = 22, step = 150, y = 40;
      for (let i = 0; i < 10; i++) {
        const id = 'M' + String(i + 1).padStart(2, '0');
        list.push({ id, label: 'Mesa ' + String(i + 1).padStart(2, '0'), x: start + i * step, y });
      }
      // 4 work desks inside the glass room (alocáveis), spread to fill the space
      const gx = 240, gy = 404, gstep = 227;
      ['A', 'B', 'C', 'D'].forEach(function(L, i) {
        list.push({ id: 'SV' + L, label: String(11 + i), x: gx + i * gstep, y: gy, small: true });
      });
      return list;
    })();

    window.COLUMNS = [
      { x: 230, y: 324 }, { x: 600, y: 324 }, { x: 1080, y: 324 }, { x: 1430, y: 324 },
    ];

    window.ZONES = [
      { id: 'corredor', label: 'Corredor', kind: 'corridor', x: 22, y: 298, w: 1476, h: 52 },
      { id: 'gerencia', label: 'Gerência', kind: 'office', x: 22, y: 374, w: 176, h: 244 },
      { id: 'sala-vidro', label: 'Sala de Vidro', kind: 'glassroom', x: 214, y: 374, w: 1000, h: 244 },
      { id: 'boothA', label: 'Sala A', kind: 'booth', x: 1090, y: 392, w: 104, h: 46 },
      { id: 'boothB', label: 'Sala B', kind: 'booth', x: 1090, y: 446, w: 104, h: 46 },
      { id: 'boothC', label: 'Sala C', kind: 'booth', x: 1090, y: 500, w: 104, h: 46 },
      { id: 'boothD', label: 'Sala D', kind: 'booth', x: 1090, y: 554, w: 104, h: 46 },
      { id: 'copa',    label: 'Copa',    kind: 'room', x: 1238, y: 374, w: 130, h: 244 },
      { id: 'entrada', label: 'Entrada', kind: 'door', x: 1368, y: 374, w: 130, h: 244 },
    ];

    window.WINDOWS = [
      { side: 'top', x: 18, y: 0, w: 1484, h: 12 },
    ];

    window.seatLayout = function(desk) {
      if (desk.small) {
        var W = 138, H = 212;
        var surf = { left: 47, top: 24, width: 44, height: 164 };
        var colL = desk.x + 26, colR = desk.x + W - 26;
        var ys = [desk.y + 54, desk.y + 106, desk.y + 158];
        var seats = [];
        ys.forEach(function(cy, i) { seats.push({ n: i + 1, cx: colL, cy: cy, side: 'l' }); });
        ys.forEach(function(cy, i) { seats.push({ n: i + 4, cx: colR, cy: cy, side: 'r' }); });
        return { W: W, H: H, surf: surf, seats: seats, small: true };
      }
      var W = 138, H = 244;
      var surf = { left: 46, top: 28, width: 46, height: 188 };
      var colL = desk.x + 26, colR = desk.x + W - 26;
      var ys = [desk.y + 64, desk.y + 124, desk.y + 184];
      var seats = [];
      ys.forEach(function(cy, i) { seats.push({ n: i + 1, cx: colL, cy: cy, side: 'l' }); });
      ys.forEach(function(cy, i) { seats.push({ n: i + 4, cx: colR, cy: cy, side: 'r' }); });
      return { W: W, H: H, surf: surf, seats: seats, small: false };
    };
  </script>

  <!-- ===== Components + App (JSX via Babel) ===== -->
  <script type="text/babel">
    /* global React, ReactDOM */
    const { useState, useEffect, useRef, useMemo } = React;

    const STORE = 'seatmap_v1';
    const SECTOR_KEYS = ['comercial', 'marketing', 'juridico', 'tecnico'];
    const TOTAL_SEATS = window.DESKS.length * 6;

    /* ---- helpers ---- */
    function initials(name) {
      const parts = (name || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '?';
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function load() {
      try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; }
    }

    let _uid = Date.now();
    const uid = () => 'p' + (_uid++).toString(36);

    /* ---- Seat ---- */
    function Seat({ seat, person, deskId, sm, onDropPerson, onDragStartSeat, onClickEmpty, onRemove }) {
      const [over, setOver] = useState(false);
      const sector = person ? window.SECTORS[person.sector] : null;
      const seatId = deskId + '-' + seat.n;
      return (
        <div className="seat-wrap" style={{ left: seat.cx, top: seat.cy }}>
          <div
            className={'seat' + (sm ? ' sm' : '') + (person ? ' filled' : ' empty') + (over ? ' over' : '')}
            draggable={!!person}
            onDragStart={(e) => { if (person) onDragStartSeat(e, seatId, person.id); }}
            onDragOver={(e) => { e.preventDefault(); if (!over) setOver(true); }}
            onDragLeave={() => setOver(false)}
            onDrop={(e) => { e.preventDefault(); setOver(false); onDropPerson(e, seatId); }}
            onClick={() => { if (!person) onClickEmpty(seatId, seat); }}
            style={person ? {
              background: sector.color,
              boxShadow: over ? `0 0 0 3px #fff, 0 0 0 6px ${sector.color}` : 'none'
            } : {}}
            title={person ? person.name + ' · ' + sector.label : 'Cadeira ' + seat.n + ' — clique para alocar'}>
            {person ? initials(person.name) : over ? '↓' : '+'}
            {person && (
              <button className="seat-remove"
                onClick={(e) => { e.stopPropagation(); onRemove(seatId); }}
                title="Remover">×</button>
            )}
          </div>
          {person && !sm && <div className="seat-name">{person.name.split(/\s+/)[0]}</div>}
        </div>
      );
    }

    /* ---- Desk ---- */
    function Desk({ desk, assignments, peopleById, handlers }) {
      const L = window.seatLayout(desk);
      return (
        <div className="island" style={{ left: desk.x, top: desk.y, width: L.W, height: L.H }}>
          <div className="desk-surface"
            style={{ left: L.surf.left, top: L.surf.top, width: L.surf.width, height: L.surf.height }}>
            <div className="desk-spine" />
          </div>
          <div className={'desk-flag' + (L.small ? ' sm' : '')}>{desk.label}</div>
          {L.seats.map((seat) => {
            const seatId = desk.id + '-' + seat.n;
            const pid = assignments[seatId];
            const person = pid ? peopleById[pid] : null;
            return (
              <Seat
                key={seat.n}
                seat={{ ...seat, cx: seat.cx - desk.x, cy: seat.cy - desk.y }}
                person={person}
                deskId={desk.id}
                sm={L.small}
                {...handlers}
              />
            );
          })}
        </div>
      );
    }

    /* ---- ZoneEl ---- */
    function ZoneEl({ z }) {
      return (
        <div className={'zone zone-' + z.kind} style={{ left: z.x, top: z.y, width: z.w, height: z.h }}>
          <span className="zone-label">{z.label}</span>
        </div>
      );
    }

    /* ---- PersonCard ---- */
    function PersonCard({ person, onDragStart, onDelete, seated }) {
      const s = window.SECTORS[person.sector];
      return (
        <div
          className={'pcard' + (seated ? ' seated' : '')}
          draggable={!seated}
          onDragStart={(e) => !seated && onDragStart(e, person.id)}
          title={seated ? person.name + ' (já alocado)' : 'Arraste para uma cadeira'}>
          <div className="pcard-av" style={{ background: s.color }}>{initials(person.name)}</div>
          <div className="pcard-name">{person.name}</div>
          {seated
            ? <span className="pcard-seat">●</span>
            : <button className="pcard-del"
                onClick={(e) => { e.stopPropagation(); onDelete(person.id); }}
                title="Excluir">×</button>
          }
        </div>
      );
    }

    /* ---- Picker modal ---- */
    function Picker({ picker, people, seatedIds, onClose, onPick }) {
      const [q, setQ] = useState('');
      const avail = people.filter(p =>
        !seatedIds.has(p.id) && p.name.toLowerCase().includes(q.toLowerCase())
      );
      return (
        <div className="modal-bg" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <h3>Alocar lugar</h3>
                <p>{picker.deskLabel} · Cadeira {picker.seatN}</p>
              </div>
              <button className="x" onClick={onClose}>×</button>
            </div>
            <input autoFocus className="input" placeholder="Buscar pessoa…"
              value={q} onChange={(e) => setQ(e.target.value)} />
            <div className="picker-list">
              {avail.length === 0 && (
                <p className="empty-note">Nenhuma pessoa disponível. Cadastre alguém primeiro.</p>
              )}
              {SECTOR_KEYS.map((k) => {
                const grp = avail.filter(p => p.sector === k);
                if (!grp.length) return null;
                return (
                  <div key={k} className="pick-group">
                    <div className="pick-group-h" style={{ color: window.SECTORS[k].color }}>
                      <i style={{ background: window.SECTORS[k].color }} />
                      {window.SECTORS[k].label}
                    </div>
                    {grp.map(p => (
                      <button key={p.id} className="pick-row" onClick={() => onPick(p.id)}>
                        <span className="pick-av" style={{ background: window.SECTORS[k].color }}>
                          {initials(p.name)}
                        </span>
                        {p.name}
                      </button>
                    ))}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    /* ---- App ---- */
    function App() {
      const saved = load();
      const [people, setPeople] = useState(saved.people || []);
      const [assignments, setAssignments] = useState(saved.assignments || {});
      const [name, setName] = useState('');
      const [sector, setSector] = useState('comercial');
      const [filter, setFilter] = useState('todos');
      const [picker, setPicker] = useState(null);
      const [scale, setScale] = useState(1);
      const [poolOver, setPoolOver] = useState(false);
      const stageRef = useRef(null);

      useEffect(() => {
        localStorage.setItem(STORE, JSON.stringify({ people, assignments }));
      }, [people, assignments]);

      useEffect(() => {
        function fit() {
          const el = stageRef.current;
          if (!el) return;
          const pad = 32;
          const s = Math.min(
            (el.clientWidth - pad) / window.FLOOR.w,
            (el.clientHeight - pad) / window.FLOOR.h
          );
          setScale(Math.max(0.2, Math.min(s, 1.1)));
        }
        fit();
        window.addEventListener('resize', fit);
        return () => window.removeEventListener('resize', fit);
      }, []);

      const peopleById = useMemo(() => Object.fromEntries(people.map(p => [p.id, p])), [people]);
      const seatedIds = useMemo(() => new Set(Object.values(assignments)), [assignments]);

      function addPerson(e) {
        e && e.preventDefault();
        const nm = name.trim();
        if (!nm) return;
        setPeople(ps => [...ps, { id: uid(), name: nm, sector }]);
        setName('');
      }

      function deletePerson(pid) {
        setPeople(ps => ps.filter(p => p.id !== pid));
        setAssignments(a => {
          const n = { ...a };
          for (const k of Object.keys(n)) if (n[k] === pid) delete n[k];
          return n;
        });
      }

      function seatOf(pid) {
        return Object.keys(assignments).find(k => assignments[k] === pid);
      }

      function assign(personId, seatId, fromSeatId) {
        setAssignments(a => {
          const n = { ...a };
          const prev = fromSeatId || seatOf(personId);
          const occupant = n[seatId];
          if (prev) delete n[prev];
          n[seatId] = personId;
          if (prev && occupant && occupant !== personId) n[prev] = occupant;
          return n;
        });
      }

      function unassign(seatId) {
        setAssignments(a => { const n = { ...a }; delete n[seatId]; return n; });
      }

      const handlers = {
        onDragStartSeat: (e, seatId, personId) => {
          e.dataTransfer.setData('text/plain', JSON.stringify({ t: 'seat', seatId, personId }));
          e.dataTransfer.effectAllowed = 'move';
        },
        onDropPerson: (e, seatId) => {
          let d;
          try { d = JSON.parse(e.dataTransfer.getData('text/plain')); } catch (_) { return; }
          if (!d) return;
          assign(d.personId, seatId, d.t === 'seat' ? d.seatId : null);
        },
        onClickEmpty: (seatId, seat) => {
          const desk = window.DESKS.find(dk => seatId.startsWith(dk.id + '-'));
          setPicker({ seatId, deskLabel: desk ? desk.label : '', seatN: seat.n });
        },
        onRemove: (seatId) => unassign(seatId),
      };

      function poolDragStart(e, personId) {
        e.dataTransfer.setData('text/plain', JSON.stringify({ t: 'pool', personId }));
        e.dataTransfer.effectAllowed = 'move';
      }

      function poolDrop(e) {
        e.preventDefault();
        setPoolOver(false);
        let d;
        try { d = JSON.parse(e.dataTransfer.getData('text/plain')); } catch (_) { return; }
        if (d && d.t === 'seat') unassign(d.seatId);
      }

      const allocated = seatedIds.size;
      const visiblePool = people.filter(p => filter === 'todos' || p.sector === filter);
      const available = visiblePool.filter(p => !seatedIds.has(p.id));
      const seatedList = visiblePool.filter(p => seatedIds.has(p.id));

      function loadSample() {
        const names = {
          comercial: ['Ana Souza', 'Bruno Lima', 'Carla Dias', 'Diego Reis'],
          marketing: ['Elisa Maia', 'Felipe Antunes', 'Gabi Rocha'],
          juridico: ['Helena Castro', 'Igor Nunes'],
          tecnico: ['Júlia Pires', 'Kaique Melo', 'Lucas Faria', 'Marina Alves', 'Nina Costa'],
        };
        const ps = [];
        Object.entries(names).forEach(([sec, list]) =>
          list.forEach(nm => ps.push({ id: uid(), name: nm, sector: sec }))
        );
        setPeople(ps);
        setAssignments({});
      }

      function clearAll() {
        if (!confirm('Limpar todos os cadastros e alocações?')) return;
        setPeople([]);
        setAssignments({});
      }

      return (
        <div className="app">
          <header className="topbar">
            <div className="brand">
              <span className="brand-mark" />
              <div>
                <h1>Mapa de Lugares</h1>
                <p>Andar Operacional · alocação por setor</p>
              </div>
            </div>
            <div className="stats">
              <div className="stat"><b>{window.DESKS.length}</b><span>mesas</span></div>
              <div className="stat"><b>{allocated}</b><span>alocados</span></div>
              <div className="stat"><b>{TOTAL_SEATS - allocated}</b><span>lugares livres</span></div>
              <div className="stat"><b>{people.length}</b><span>cadastrados</span></div>
            </div>
            <div className="top-actions">
              <button className="btn ghost" onClick={loadSample}>Exemplo</button>
              <button className="btn ghost" onClick={clearAll}>Limpar</button>
            </div>
          </header>

          <div className="body">
            <aside className="sidebar">
              <section className="card">
                <h2>Cadastrar pessoa</h2>
                <form onSubmit={addPerson} className="reg-form">
                  <input
                    className="input"
                    placeholder="Nome da pessoa"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                  />
                  <div className="sector-pick">
                    {SECTOR_KEYS.map(k => (
                      <button type="button" key={k}
                        className={'sector-chip' + (sector === k ? ' on' : '')}
                        style={sector === k
                          ? { background: window.SECTORS[k].color, borderColor: window.SECTORS[k].color, color: '#fff' }
                          : { color: window.SECTORS[k].color, borderColor: window.SECTORS[k].color }}
                        onClick={() => setSector(k)}>
                        {window.SECTORS[k].label}
                      </button>
                    ))}
                  </div>
                  <button className="btn primary" type="submit">
                    + Adicionar ao {window.SECTORS[sector].label}
                  </button>
                </form>
              </section>

              <section className="card pool-card">
                <div className="pool-head">
                  <h2>Pessoas</h2>
                  <span className="hint">arraste para uma cadeira →</span>
                </div>
                <div className="filter-tabs">
                  <button className={'ftab' + (filter === 'todos' ? ' on' : '')}
                    onClick={() => setFilter('todos')}>Todos</button>
                  {SECTOR_KEYS.map(k => (
                    <button key={k} className={'ftab' + (filter === k ? ' on' : '')}
                      onClick={() => setFilter(k)}>
                      <i style={{ background: window.SECTORS[k].color }} />
                      {window.SECTORS[k].label}
                    </button>
                  ))}
                </div>

                <div
                  className={'pool' + (poolOver ? ' dragover' : '')}
                  onDragOver={(e) => { e.preventDefault(); setPoolOver(true); }}
                  onDragLeave={() => setPoolOver(false)}
                  onDrop={poolDrop}>
                  <div className="pool-sub">Disponíveis ({available.length})</div>
                  {available.length === 0 && (
                    <p className="empty-note">Ninguém disponível neste filtro.</p>
                  )}
                  <div className="pool-grid">
                    {available.map(p => (
                      <PersonCard key={p.id} person={p}
                        onDragStart={poolDragStart} onDelete={deletePerson} />
                    ))}
                  </div>
                  {seatedList.length > 0 && (
                    <div className="pool-sub muted">Já alocados ({seatedList.length})</div>
                  )}
                  <div className="pool-grid">
                    {seatedList.map(p => (
                      <PersonCard key={p.id} person={p} seated onDelete={deletePerson} />
                    ))}
                  </div>
                </div>
              </section>
            </aside>

            <main className="stage" ref={stageRef}>
              <div className="floor-scaler"
                style={{ transform: `scale(${scale})`, width: window.FLOOR.w, height: window.FLOOR.h }}>
                <div className="floor" style={{ width: window.FLOOR.w, height: window.FLOOR.h }}>
                  <div className="tiles" />
                  {window.WINDOWS.map((w, i) => (
                    <div key={i} className={'window window-' + w.side}
                      style={{ left: w.x, top: w.y, width: w.w, height: w.h }} />
                  ))}
                  {window.ZONES.map(z => <ZoneEl key={z.id} z={z} />)}
                  {window.COLUMNS.map((c, i) => (
                    <div key={i} className="pillar" style={{ left: c.x - 22, top: c.y - 22 }} />
                  ))}
                  {window.DESKS.map(d => (
                    <Desk key={d.id} desk={d} assignments={assignments}
                      peopleById={peopleById} handlers={handlers} />
                  ))}
                  <div className="floor-legend">
                    {SECTOR_KEYS.map(k => (
                      <div key={k} className="lg">
                        <i style={{ background: window.SECTORS[k].color }} />
                        {window.SECTORS[k].label}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </main>
          </div>

          {picker && (
            <Picker
              picker={picker}
              people={people}
              seatedIds={seatedIds}
              onClose={() => setPicker(null)}
              onPick={(pid) => { assign(pid, picker.seatId); setPicker(null); }}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
